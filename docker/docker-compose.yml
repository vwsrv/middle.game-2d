services:
  client:
      container_name: 2d-game-client-cnt
      image: 2d-game-client-image
      build:
          context: ..
          dockerfile: docker/Dockerfile.client
          args:
            CLIENT_PORT: ${CLIENT_PORT}
      restart: always
      ports:
          - "${CLIENT_PORT}:80"
      environment:
        - CLIENT_PORT=${CLIENT_PORT}
        - SERVER_PORT=${SERVER_PORT}
      env_file:
        - .env
      networks:
        - awesome
  server:
      container_name: 2d-game-server-cnt
      image: 2d-game-server-image
      build:
          context: ..
          dockerfile: docker/Dockerfile.server
          args:
            SERVER_PORT: ${SERVER_PORT}
      restart: always
      ports:
          - "${SERVER_PORT}:${SERVER_PORT}"
      environment:
        SERVER_PORT: ${SERVER_PORT}
      env_file:
          - .env
      networks:
        - awesome
      depends_on:
        - postgres

  postgres:
    image: postgres:17-alpine    
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./tmp/pgdata:/var/lib/postgresql/data
    restart: always
    networks:
      - awesome

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4:4.18
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "8080:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - awesome

volumes:
  pgadmin-data:

networks:
  awesome:
    driver: bridge 

